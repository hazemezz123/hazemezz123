name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update README files
        run: python generate_readme.py
      - name: Commit
        run: |-
          git add .
          git diff --quiet && echo "No changes to commit" || { git config --global user.email "hazemezz988@gmail.com"; git config --global user.name "hazemezz123"; git commit -m "Updated README"; git push; }
